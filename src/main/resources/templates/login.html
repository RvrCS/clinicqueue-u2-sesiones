<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head><meta charset="UTF-8"><title>Entrar · ClinicQueue</title><link rel="stylesheet" th:href="@{/style.css}"></head>
<body>
<header><h1>ClinicQueue</h1><a href="/">Volver</a></header>
<main>
    <h2>Iniciar sesion</h2>
    <p th:if="${error}" class="error" th:text="${error}">error</p>
    <form action="/login" method="post">
        <label>Usuario <input type="text" name="username" required></label>
        <label>Contrasena <input type="password" name="password" required></label>
        <button type="submit">Entrar</button>
    </form>
</main>
</body>
</html>
